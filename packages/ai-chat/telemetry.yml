# yaml-language-server: $schema=https://unpkg.com/@ibm/telemetry-config-schema@v1/dist/config.schema.json

version: 1
projectId: ef967584-5788-47d4-b9c2-a60da7ad901d
endpoint: https://www-api.ibm.com/ibm-telemetry/v1/metrics
collect:
  wc:
    elements:
      allowedAttributeNames:
        # General
        - element
        # cds-aichat-container
        - ai-disabled
        - ai-enabled
        - assistant-name
        - debug
        - disable-custom-element-mobile-enhancements
        - disclaimer
        - expose-service-manager-for-testing
        - header
        - hide-avatar
        - history
        - homescreen
        - inject-carbon-theme
        - input
        - is-readonly
        - keyboardshortcuts
        - launcher
        - layout
        - locale
        - messaging
        - namespace
        - onViewChange
        - onViewPreChange
        - open-chat-by-default
        - persist-feedback
        - service-desk
        - should-sanitize-html
        - should-take-focus-if-opens-automatically
        - strings
        # cds-aichat-internal
        - config
        - onAfterRender
        - onBeforeRender
      allowedAttributeStringValues:
        # General - boolean attributes
        - "true"
        - "false"
      allowedAttributeObjectKeys:
        # input (InputConfig keys)
        - actions
        - autocomplete
        - command
        - error
        - expanded
        - isSendDisabled
        - isDisabled
        - isVisible
        - maxInputCharacters
        - mention
        - starters
        - tiptap
  npm:
    dependencies: null
  js:
    functions: {}
    tokens: null
