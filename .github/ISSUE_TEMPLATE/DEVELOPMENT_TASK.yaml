name: Development task 🛠️
description: A unit of internal development work, often a sub-issue of an epic
title: '[Task]: '
type: 'task'
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: "Why this work matters. Open with who is bitten and what goes wrong today. A reader without your context decides from that first sentence whether this issue concerns them, so keep file names, scripts, and type names for Goal. Then the links: the parent epic if this is a sub-issue, and the ADR if this implements a recorded decision. The ADR is where a reviewer checks the diff against what was agreed."
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: "What this task delivers — the change that exists when it's done."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: "The conditions that must hold before this can be closed, as a checkbox list. One observable outcome per box, each carrying its proof — a command that exits 0, a named spec, or demo steps with the expected result. The last box is the definition-of-done gate for every area this touches; see references/definition-of-done.md."
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: public-api-contract
    attributes:
      label: Public API / contract
      description: "If this changes what a consumer can observe on the public surface — anything exported from packages/ai-chat/src/aiChatEntry.tsx or serverEntry.ts — define the contract here up front. A change with no signature change still qualifies: behavior is public too. Give the data types (interfaces / type aliases) and method signatures, then the behavior the shape can't carry — preconditions, the no-op case, failure, events, timing, repeat calls, defaults, the derivation rule for each value of any state a host can read, what a screen reader hears, and which side does the work."
      render: typescript
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: "What this task deliberately does not cover. One line per excluded item, with the reason it is excluded. If an exclusion needs a paragraph, the reasoning belongs in an ADR or a sibling issue. Link to it from one line here."
  - type: textarea
    id: related
    attributes:
      label: Related
      description: "Parent epic, sibling issues, PRs, designs."
