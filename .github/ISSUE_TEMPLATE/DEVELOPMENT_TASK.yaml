name: Development task 🛠️
description: A unit of internal development work, often a sub-issue of an epic
title: '[Task]: '
type: 'task'
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: 'Why this work matters. Open with who is bitten and what goes wrong today, in plain language, before any file, script, or type name. A reader without your context decides from that first sentence whether this issue concerns them. Then the links: the parent epic if this is a sub-issue, and the ADR if this implements a recorded decision.'
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 'The outcome this task exists for, not the mechanism that delivers it. Leave the fix to whoever plans the work.'
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: 'The outcomes that must hold before this can close, as a checkbox list. One observable outcome per box: what a user, a host developer, the type surface, or the build sees. No spec paths, test names, or commands. The developer picks the proof when they plan the work.'
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: 'What is already settled and binds any fix: an accepted ADR, a compatibility promise, an accessibility requirement. Leave empty when nothing is. A preference belongs under Possible approaches.'
  - type: textarea
    id: possible-approaches
    attributes:
      label: Possible approaches
      description: "Optional. Fixes you can see, each with its tradeoff. These are options for whoever plans the work, not a decision, so don't pick one."
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: "Optional. What you don't know and the developer has to find out."
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: 'What this task deliberately does not cover. One line per excluded item, with the reason it is excluded. If an exclusion needs a paragraph, the reasoning belongs in an ADR or a sibling issue. Link to it from one line here.'
  - type: textarea
    id: related
    attributes:
      label: Related
      description: 'Parent epic, sibling issues, PRs, designs.'
