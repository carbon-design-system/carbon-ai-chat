name: ci-check
on:
  push:
    branches: [main, release/v*, feat/prompt-line]
  pull_request:
    branches: [main, release/v*, feat/prompt-line]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'merge_group'
        id: cache
        with:
          path: |
            node_modules
            */**/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline
      - name: Run build
        run: npm run aiChat:build
      # 👇 Test jobs reuse this output instead of rebuilding
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            packages/ai-chat-components/es
            packages/ai-chat-components/es-custom
            packages/ai-chat-components/dist
            packages/ai-chat-components/scss
            packages/ai-chat-components/custom-elements.json
            packages/ai-chat/dist
          if-no-files-found: error
          retention-days: 1
      - name: Validate TypeDoc links
        run: npm run docs --workspace=@carbon/ai-chat

  # 👇 Each suite gets its own runner so they don't compete for CPU
  test-suite:
    name: test (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: ai-chat 1/2
            run: npm run test --workspace=@carbon/ai-chat -- --shard=1/2
          - suite: ai-chat 2/2
            run: npm run test --workspace=@carbon/ai-chat -- --shard=2/2
          - suite: components
            browsers: chromium firefox webkit
            run: npm run test --workspace=@carbon/ai-chat-components
          - suite: demo
            browsers: chromium firefox
            run: npm run test --workspace=@carbon/ai-chat-examples-demo
          # 👇 Every other package with a test script
          - suite: examples
            browsers: chromium
            run: npm run test:examples && npm run test:versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'merge_group'
        id: cache
        with:
          path: |
            node_modules
            */**/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline
      - name: Install Playwright browsers
        if: matrix.browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: packages
      - name: Run test
        run: ${{ matrix.run }}

  # 👇 Branch protection requires a check named `test`; this reports the matrix as one
  test:
    if: always()
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Require every test suite to pass
        if: needs.test-suite.result != 'success'
        run: exit 1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'merge_group'
        id: cache
        with:
          path: |
            node_modules
            */**/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline
      - name: Check formatting of project files (staged)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run format:staged
      - name: Check formatting of project files (non-staged)
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run format

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'merge_group'
        id: cache
        with:
          path: |
            node_modules
            */**/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline
      - name: Lint
        run: npm run lint && npm run lint:styles

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: License check
        run: npm run lint:license

  validate-agents-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Validate agents files
        run: npm run validate:agents
      - name: Validate agent skills
        run: npm run validate:skills
      - name: Test guidance validators
        run: npm run test:guidance
      - name: Verify example READMEs
        run: npm run verify:example-readmes

  chromatic-wc-storybook:
    # 👇 A new release branch points at a commit main already built, so skip its first push
    if: ${{ github.repository == 'carbon-design-system/carbon-ai-chat' && github.event.pull_request.draft == false && !github.event.created }}
    runs-on: ubuntu-latest
    outputs:
      buildUrl: ${{ steps.chromatic.outputs.buildUrl }}
      storybookUrl: ${{ steps.chromatic.outputs.storybookUrl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 👇 Tells the checkout which commit hash to reference
          # https://www.chromatic.com/docs/github-actions/#recommended-configuration-for-build-events
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'merge_group'
        id: cache
        with:
          path: |
            node_modules
            */**/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: github.event_name != 'merge_group' && steps.cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline
      - name: Build @carbon/ai-chat-components package
        if: github.event_name != 'merge_group'
        run: npm run build --workspace=@carbon/ai-chat-components
      - id: chromatic
        name: Run Chromatic
        uses: chromaui/action@38afd264ef2241136f12d039093c2724748bec08 # v18.11.0
        with:
          # 👇 Token is intentionally plaintext
          # https://www.chromatic.com/docs/github-actions/#run-chromatic-on-external-forks-of-open-source-projects
          projectToken: chpt_bdf649378875471
          workingDir: packages/ai-chat-components
          buildScriptName: storybook:build
          zip: true # Runs Chromatic with the option to compress the build output
          autoAcceptChanges: 'main' # Option to accept all changes on main
          onlyChanged: true # 👈 Required option to enable TurboSnap
          # 👇 Example apps aren't in the Storybook graph, so their manifests shouldn't disable TurboSnap
          untraced: 'examples/**'
          # 👇 `main` push rebuilds the merge-queue SHA, so pass the queue check without snapshots
          skip: '**/gh-readonly-queue/**'
        env:
          # 👇 Set to the PR branch if it's a PR; otherwise, falls back to the pushed branch name
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          # 👇 Set to the PR head commit if it's a PR; otherwise to the ref (which typically resolves to the latest commit SHA)
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.ref }}
          # 👇 Makes sure this is always set to the corect owner/repo
          CHROMATIC_SLUG: ${{ github.repository }}

  chromatic-react-wrapper-storybook:
    # 👇 A new release branch points at a commit main already built, so skip its first push
    if: ${{ github.repository == 'carbon-design-system/carbon-ai-chat' && github.event.pull_request.draft == false && !github.event.created }}
    runs-on: ubuntu-latest
    outputs:
      buildUrl: ${{ steps.chromatic.outputs.buildUrl }}
      storybookUrl: ${{ steps.chromatic.outputs.storybookUrl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 👇 Tells the checkout which commit hash to reference
          # https://www.chromatic.com/docs/github-actions/#recommended-configuration-for-build-events
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'merge_group'
        id: cache
        with:
          path: |
            node_modules
            */**/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: github.event_name != 'merge_group' && steps.cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline
      - name: Build @carbon/ai-chat-components package
        if: github.event_name != 'merge_group'
        run: npm run build --workspace=@carbon/ai-chat-components
      - id: chromatic
        name: Run Chromatic
        uses: chromaui/action@38afd264ef2241136f12d039093c2724748bec08 # v18.11.0
        with:
          # 👇 Token is intentionally plaintext
          # https://www.chromatic.com/docs/github-actions/#run-chromatic-on-external-forks-of-open-source-projects
          projectToken: chpt_b20070be5bf15ee
          workingDir: packages/ai-chat-components
          buildScriptName: storybook:react:build
          zip: true # Runs Chromatic with the option to compress the build output
          autoAcceptChanges: 'main' # Option to accept all changes on main
          onlyChanged: true # 👈 Required option to enable TurboSnap
          # 👇 Example apps aren't in the Storybook graph, so their manifests shouldn't disable TurboSnap
          untraced: 'examples/**'
          # 👇 `main` push rebuilds the merge-queue SHA, so pass the queue check without snapshots
          skip: '**/gh-readonly-queue/**'
        env:
          # 👇 Set to the PR branch if it's a PR; otherwise, falls back to the pushed branch name
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          # 👇 Set to the PR head commit if it's a PR; otherwise to the ref (which typically resolves to the latest commit SHA)
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.ref }}
          # 👇 Makes sure this is always set to the corect owner/repo
          CHROMATIC_SLUG: ${{ github.repository }}
