name: Update versions.js file

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        description: 'SHA of the checkout used to build both Storybooks'
        type: string
      chat_version:
        required: true
        description: 'Stable @carbon/ai-chat package version, without v'
        type: string
      components_version:
        required: true
        description: 'Stable @carbon/ai-chat-components package version, without v'
        type: string
  repository_dispatch:
    types: [update-versions-file]

concurrency:
  group: update-versions-file
  queue: max
  cancel-in-progress: false

jobs:
  update-versions-file:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.sha
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BUILD_SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
      CHAT_VERSION: ${{ github.event.client_payload.chat_version || github.event.inputs.chat_version }}
      COMPONENTS_VERSION: ${{ github.event.client_payload.components_version || github.event.inputs.components_version }}
      AWS_ACCESS_KEY_ID: ${{ secrets.COMMON_COS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.COMMON_COS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.COMMON_COS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          ref: ${{ github.event.client_payload.branch || github.ref_name }}
          token: ${{ secrets.PAT }}

      - name: Checkout current catalog updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: catalog-tools
          persist-credentials: false

      - name: Sync target branch
        env:
          TARGET_BRANCH: ${{ github.event.client_payload.branch || github.ref_name }}
          BOT_EMAIL: ${{ secrets.CARBON_BOT_EMAIL }}
          BOT_NAME: ${{ secrets.CARBON_BOT_NAME }}
        run: |
          git config user.email "$BOT_EMAIL"
          git config user.name "$BOT_NAME"
          git pull --ff-only origin "$TARGET_BRANCH"

      - name: Read published catalog directly from COS
        env:
          COS_BUCKET: ${{ secrets.COMMON_COS_BUCKET }}
          COS_ENDPOINT: ${{ secrets.COMMON_COS_ENDPOINT }}
        run: |
          aws --endpoint-url "https://$COS_ENDPOINT" s3 cp "s3://$COS_BUCKET/versions.js" published-versions.js

      - name: Verify deployed Storybook destinations
        id: verify-pages
        env:
          COS_BUCKET: ${{ secrets.COMMON_COS_BUCKET }}
          COS_ENDPOINT: ${{ secrets.COMMON_COS_ENDPOINT }}
        run: |
          for flavor in storybook storybook/react; do
            aws --endpoint-url "https://$COS_ENDPOINT" s3api head-object \
              --bucket "$COS_BUCKET" \
              --key "components/$flavor/version/v${COMPONENTS_VERSION}/index.html" > /dev/null
          done
          if ! grep -q 'export const AI_CHAT_COMPONENTS_VERSIONS' published-versions.js; then
            for flavor in storybook storybook/react; do
              curl --fail --location --silent --show-error --retry 3 \
                "https://chat.carbondesignsystem.com/components/$flavor/version/v1.11.0/index.html" \
                --output /dev/null
            done
          fi
          echo 'seed_verified=true' >> "$GITHUB_OUTPUT"

      - name: Merge published history with built versions
        env:
          SEED_VERIFIED: ${{ steps.verify-pages.outputs.seed_verified }}
        run: node catalog-tools/scripts/update-versions-file.cjs

      - name: Commit updated catalog
        env:
          TARGET_BRANCH: ${{ github.event.client_payload.branch || github.ref_name }}
        run: |
          if git diff --quiet -- versions.js; then
            echo 'Catalog is unchanged.'
          else
            git add versions.js
            git commit -m 'chore: update versions.js file'
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Prepare catalog upload
        run: mkdir catalog-upload && cp versions.js catalog-upload/

      - name: Upload versions.js to COS
        uses: jakejarvis/s3-sync-action@7ed8b112447abb09f1da74f3466e4194fc7a6311 # master
        with:
          args: --acl public-read --follow-symlinks
        env:
          AWS_S3_BUCKET: ${{ secrets.COMMON_COS_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.COMMON_COS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.COMMON_COS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.COMMON_COS_REGION }}
          AWS_S3_ENDPOINT: https://${{ secrets.COMMON_COS_ENDPOINT }}
          SOURCE_DIR: 'catalog-upload'
