<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>
      @carbon/ai-chat - web components - markdown override (code snippet)
    </title>
    <link
      rel="stylesheet"
      href="https://1.www.s81c.com/common/carbon/plex/sans.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          'IBM Plex Sans',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          '.SFNSText-Regular',
          sans-serif;
      }
      cds-aichat-custom-element.chat-custom-element {
        display: block;
        height: 100vh;
        width: 100vw;
      }
      /* Round the code snippets this example renders to match the chat's
         corners, by reading the corner tokens. Each corner falls back to the
         base radius, less 1px to sit inside the border. */
      cds-aichat-code-snippet {
        border-start-start-radius: calc(
          var(
              --cds-aichat-border-radius-start-start,
              var(--cds-aichat-border-radius)
            ) -
            1px
        );
        border-start-end-radius: calc(
          var(
              --cds-aichat-border-radius-start-end,
              var(--cds-aichat-border-radius)
            ) -
            1px
        );
        border-end-start-radius: calc(
          var(
              --cds-aichat-border-radius-end-start,
              var(--cds-aichat-border-radius)
            ) -
            1px
        );
        border-end-end-radius: calc(
          var(
              --cds-aichat-border-radius-end-end,
              var(--cds-aichat-border-radius)
            ) -
            1px
        );
      }
    </style>
  </head>
  <body>
    <cds-aichat-custom-element
      class="chat-custom-element"></cds-aichat-custom-element>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
